[project]
name = "crop-disease-detector"
version = "0.1.0"
description = "Crop disease detection for Indian farmers"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "mlflow>=2.0.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pillow",
    "imagehash",
    "tqdm",
    "opencv-python",
    "kaggle>=2.2.3",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
name = "pytorch-cuda"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]
